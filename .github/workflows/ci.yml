name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Re-run the gates on demand. GitHub does not always schedule a run for a
  # pull request opened on a branch that was pushed first, and there is no
  # honest way to kick one otherwise: an empty commit or a close-and-reopen
  # fakes an event rather than asking for the checks. This asks for them.
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        # `npm ci` rather than `npm install`: it installs exactly what the
        # lockfile pins and FAILS when package.json and package-lock.json
        # disagree, instead of quietly resolving a different tree than the one
        # anyone tested. The comment this replaces said the lockfile lagged the
        # manifest and that `npm install` was the workaround; that is no longer
        # true — `npm ci` completes cleanly in 37s against the committed
        # lockfile, and every other workflow in this repository already prefers
        # it.
        #
        # Note the repo also carries `bun.lock` and `bun.lockb`. No workflow
        # uses them and `bun.lockb` predates the support-ticketing dependencies
        # by three weeks, so anyone running `bun install` gets a tree that is
        # missing packages the app now imports. Left in place because the
        # generating platform's own toolchain was not verified from here.
        run: npm ci --no-audit --no-fund

      # Runs before the typecheck it protects: a table missing from the
      # generated types makes every query against it resolve to `never`, so the
      # typecheck goes green precisely because nothing is being checked.
      - name: Supabase types match migrations
        run: npm run check:supabase-types

      # The typecheck is only as good as the files it is allowed to see.
      - name: '@ts-nocheck budget'
        run: npm run check:ts-nocheck

      # A table with RLS on and no policy is closed, and closed reads answer
      # with an empty array rather than an error — so nothing at runtime says so.
      - name: RLS policy coverage
        run: npm run check:rls

      # A worker nobody schedules produces no error anywhere — the queue simply
      # never drains. Six were in that state, each documenting its own cadence.
      - name: Cron coverage
        run: npm run check:cron

      - name: No scheduled job can send an empty credential
        run: npm run check:cron-auth

      # A credential written into a migration produces no runtime signal at all:
      # the migration runs correctly, every check stays green, and the value is
      # readable by anyone with repository access. One shipped the live
      # CRON_SECRET this way. Anon JWTs are judged by their decoded role and
      # allowed, because five are committed on purpose.
      - name: No credentials in migrations
        run: npm run check:migration-secrets

      # `applyPrimeMigrations` replays this corpus onto every clone backend and
      # halts on the first failure. It halted at migration 69 of 192 — every
      # clone provisioned since received 75 of 153 tables, and nothing said so.
      - name: Migration corpus stays replayable
        run: npm run check:migration-replay

      # A migration merges and never applies, twice over: a filename the version
      # regex cannot read is refused by the apply-on-merge workflow, and two
      # files sharing a version are recorded once — the loser chosen by sort
      # order, reported by nothing. Both are silent, and both are a rename away.
      - name: Migrations can be applied and recorded
        run: npm run check:migration-pipeline

      # Two failures with no runtime signal, on the deployment path: a secret
      # given a `VITE_` name is inlined into the client bundle and served to the
      # public with nothing logging it, and a deployment status the column
      # refuses makes an update fail with an error this codebase has a habit of
      # discarding — so the row simply never advances.
      - name: Prime backend ref is configured, never derived
        run: npm run check:prime-backend-ref

      - name: Hosting env policy and deployment state parity
        run: npm run check:hosting

      # Postgres indexes the referenced side of a foreign key and never the
      # referencing side, so an unindexed FK is a sequential scan on every join
      # and every cascade check — invisible while a table is small.
      - name: Foreign key indexes
        run: npm run check:fk-indexes

      # A Supabase write does not throw; it resolves to { data, error }. A
      # discarded error means the row is silently absent later. Budget shrinks only.
      - name: Discarded Supabase errors
        run: npm run check:discarded-errors

      # `supabase_migrations.schema_migrations` cannot say whether a migration
      # applied on this deployment -- 40 of 211 repo versions appear in it and
      # 103 of its rows match no repo file, because Lovable stamps its own apply
      # timestamps. So each new migration declares its own effect, and an
      # undeclared or unparseable claim fails here rather than leaving the
      # hourly drift alarm reporting on a corpus it cannot see.
      - name: Migrations declare a checkable effect
        run: npm run check:migration-assertions

      # The alarm runs in a Worker with no filesystem, so the claims travel as
      # generated code. A generated file allowed to go stale keeps reporting on
      # a corpus that has moved -- and reports it healthy.
      - name: Migration assertion manifest is current
        run: npm run migrations:assertions:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
