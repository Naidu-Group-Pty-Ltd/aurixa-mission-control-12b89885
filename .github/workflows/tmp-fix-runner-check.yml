name: tmp fix runner check
# Temporary, removed in the next commit. Runs the remediation workflow's own
# step scripts (codex-remediation.yml) on a GitHub-hosted runner against a
# sample project — no agent, no key, no PR, no callback — to check what they
# rest on there: a closed $HOME and $RUNNER_TEMP, the pinned agent installs,
# bun's lockfile migration, and the checks running as a user of their own.

on:
  push:
    branches: [claude/serene-gates-b7f5pi]
    paths: [.github/workflows/tmp-fix-runner-check.yml]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLAUDE_CODE_VERSION: "2.1.289"
      CODEX_CLI_VERSION: "0.160.1"
      BUN_VERSION: "1.3.11"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Extract the remediation workflow's step scripts
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/yaml" --no-save --no-audit --no-fund js-yaml@5.5.0 >/dev/null
          mkdir -p "$RUNNER_TEMP/steps"
          NODE_PATH="$RUNNER_TEMP/yaml/node_modules" node -e '
            const fs = require("fs");
            const yaml = require("js-yaml");
            const doc = yaml.load(fs.readFileSync(".github/workflows/codex-remediation.yml", "utf8"));
            for (const step of doc.jobs["draft-fix"].steps) {
              if (!["Prepare helper directory and callback key", "Install the fix agent", "Regenerate lockfiles", "Verify the patched tree"].includes(step.name)) continue;
              fs.writeFileSync(process.env.RUNNER_TEMP + "/steps/" + step.name.replace(/\W+/g, "-") + ".sh", step.run);
            }
          '
          ls -la "$RUNNER_TEMP/steps"
          id
          ls -ld "$HOME" "$RUNNER_TEMP" /opt/hostedtoolcache "$(dirname "$(command -v node)")"

      - name: Close the job's files the way the remediation workflow does
        run: |
          set -euo pipefail
          # The lines of its first step that do it (the rest needs a dispatch payload).
          grep -E '^chmod (700 "\$RUNNER_TEMP"|o-rwx "\$HOME")$' "$RUNNER_TEMP/steps/Prepare-helper-directory-and-callback-key.sh" > "$RUNNER_TEMP/close.sh"
          test "$(wc -l < "$RUNNER_TEMP/close.sh")" = 2
          bash -euo pipefail "$RUNNER_TEMP/close.sh"
          mkdir -p "$RUNNER_TEMP/codex-helpers"
          echo "HELPER_DIR=$RUNNER_TEMP/codex-helpers" >> "$GITHUB_ENV"
          ls -ld "$HOME" "$RUNNER_TEMP"

      - name: Install Claude Code (the remediation workflow's step)
        env:
          ENGINE: claude
        run: bash -eo pipefail "$RUNNER_TEMP/steps/Install-the-fix-agent.sh" && claude --version

      - name: Install Codex (the same step)
        env:
          ENGINE: codex
        run: bash -eo pipefail "$RUNNER_TEMP/steps/Install-the-fix-agent.sh" && codex --version

      - name: A sample checkout, and a dependency fix to it
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/sample"
          mkdir -p "$W" && cd "$W"
          git init -q -b main .
          cat > package.json <<'EOF'
          {
            "name": "sample",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "typecheck": "node -e \"process.exit(0)\"",
              "lint": "node -e \"process.exit(0)\"",
              "test": "node test.js",
              "build": "node -e \"require('fs').mkdirSync('dist', { recursive: true })\""
            },
            "dependencies": { "ms": "2.0.0" }
          }
          EOF
          printf 'const ms = require("ms");\nmodule.exports = () => ms("1s");\n' > app.js
          printf 'if (require("./app")() !== 1000) process.exit(1);\nconsole.log("tests ok");\n' > test.js
          printf 'node_modules\ndist\n' > .gitignore
          printf '[install]\nsaveTextLockfile = false\n' > bunfig.toml
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund >/dev/null
          env -C "$RUNNER_TEMP" npm install --prefix "$RUNNER_TEMP/bun0" --no-save --no-audit --no-fund "bun@${BUN_VERSION}" >/dev/null
          "$RUNNER_TEMP/bun0/node_modules/.bin/bun" install --lockfile-only --ignore-scripts
          git add -A
          git -c user.name=t -c user.email=t@example.com commit -qm base
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          cp -a . "$RUNNER_TEMP/base-tree"
          cp -a .git "$RUNNER_TEMP/collect.git"
          sed -i 's/"ms": "2.0.0"/"ms": "2.1.3"/' package.json

      - name: Regenerate lockfiles (the remediation workflow's step)
        working-directory: ${{ runner.temp }}/sample
        run: bash -eo pipefail "$RUNNER_TEMP/steps/Regenerate-lockfiles.sh"

      - name: Stage the patch as the remediation workflow does
        working-directory: ${{ runner.temp }}/sample
        run: |
          set -euo pipefail
          GIT=(git --git-dir="$RUNNER_TEMP/collect.git" --work-tree="$PWD" -c core.fsmonitor=false -c core.hooksPath=/dev/null)
          "${GIT[@]}" add -A
          "${GIT[@]}" diff --cached --no-ext-diff --no-textconv --binary "$BASE_SHA" > "$RUNNER_TEMP/fix.patch"
          git apply --stat "$RUNNER_TEMP/fix.patch"
          "$RUNNER_TEMP/bun0/node_modules/.bin/bun" install --frozen-lockfile --ignore-scripts --dry-run

      - name: Verify the patched tree (the remediation workflow's step)
        id: verify
        working-directory: ${{ runner.temp }}/sample
        run: bash -o pipefail "$RUNNER_TEMP/steps/Verify-the-patched-tree.sh"

      - name: What the checks' user can and cannot reach
        env:
          OK: ${{ steps.verify.outputs.ok }}
        run: |
          set -uo pipefail
          cat "$RUNNER_TEMP/verification.json"; echo
          probe() {
            if sudo -u fixcheck -H env -i PATH="$PATH" bash -c "$2" >/dev/null 2>&1; then
              echo "REACHABLE: $1"; return 1
            fi
            echo "closed: $1"
          }
          fails=0
          probe "the event payload" "cat '$GITHUB_EVENT_PATH'" || fails=1
          probe "the job's temporary directory" "ls '$RUNNER_TEMP'" || fails=1
          probe "the runner's home" "ls '$HOME'" || fails=1
          probe "a step's environment" "cat /proc/$$/environ" || fails=1
          NODE_BIN="$(dirname "$(command -v node)")"
          probe "the tool cache's node directory (write)" "touch '$NODE_BIN/planted'" || fails=1
          probe "the node binary (write)" "test -w '$NODE_BIN/node'" || fails=1
          probe "the global CLIs (write)" "test -w '$(readlink -f "$(command -v claude)")'" || fails=1
          IFS=: read -ra PATH_DIRS <<< "$PATH"
          for d in "${PATH_DIRS[@]}"; do
            [ -d "$d" ] && { probe "PATH directory $d (write)" "touch '$d/planted'" || fails=1; }
          done
          sudo -u fixcheck -H env -i PATH="$PATH" bash -c 'node --version && npm --version' || fails=1
          test "$OK" = "true" || { echo "verification did not pass"; fails=1; }
          exit "$fails"
