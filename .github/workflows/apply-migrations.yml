name: Apply migrations on merge

# Hands the migration files a merge ADDED to Mission Control, which queues them
# in its own database for a postgres-owned pg_cron job to apply within the
# minute. Waits for the outcome and fails on anything short of applied.
#
# ## Why this no longer uses the Supabase Management API
#
# It could never have worked. Mission Control's database is a Lovable Cloud
# project in LOVABLE's Supabase organisation, so no token issued to this account
# reaches it -- `get_project` answers 403, and Supabase's own docs say a Lovable
# Cloud project has no service-role key and no direct database URL. The workflow
# failed on every run since it was created and its message,
# "SUPABASE_ACCESS_TOKEN is not set", pointed at a secret that could not have
# helped. Setting it would have changed the error, not the outcome.
#
# docs/MIGRATION_QUEUE.md carries the design; docs/MIGRATION_AUTOMATION_OPTIONS.md
# records every other channel that was probed and blocked.
#
# ## The target is not configurable any more
#
# The old path took a `PROJECT_REF` and defended itself against its own
# configuration with a forbidden-ref list and a behavioural identity probe,
# because the Management API token reaches every project in the organisation and
# a wrong ref did not fail -- it wrote this control plane's admin schema onto a
# tenant. Now the SQL goes to Mission Control, and Mission Control writes to the
# database it is connected to. There is no ref to get wrong.
#
# ## The gap this closes
#
# Mission Control is edited in two places: this repository, and Lovable. Lovable
# applies the migrations it authors. Nothing applied the ones that arrive here
# through a pull request — they merged, they shipped in the repo, and the
# database never saw them. Measured on 2026-08-27, `20260826070000` (the mirror
# cascade's exclusion seed) and `20260827030000` (the ALLOWED_ORIGINS reconcile
# schedule) had both merged and neither existed in the database. The first left
# a cascade able to revert a clone's backend identity; the second left a cron
# job that was never created, so a worker that had shipped correctly simply
# never ran.
#
# Nothing reported either. A migration that never runs looks exactly like one
# that ran and did nothing.
#
# ## Why it keys on the push, not on the ledger
#
# `supabase_migrations.schema_migrations` cannot answer "what is pending" in
# this project — it is a second namespace, written by Lovable under its own
# timestamps, and it under-reports by 172 of 207 files. `.github/scripts/
# apply-migrations.mjs` carries the measurement. So the file list comes from
# git: the migrations added between the push's before and after SHAs.
#
# ## Ordering against the deploy
#
# This runs on push to `main`; the application itself is published from Lovable.
# Migrations therefore land before or without the code that uses them, which is
# the safe order for the additive migrations this repo writes — a column that
# exists before its reader is inert, a column that arrives after is a 42703.
# A migration that REMOVES something a live deployment still reads has to be
# staged by hand, in two merges.
#
# ## The gates run HERE, because nothing was waiting for them
#
# `ci.yml` runs the four migration gates and PR #148's corpus guard. It fires
# on the same push as this workflow and the two run CONCURRENTLY — nothing
# makes the apply wait for the gate, and a red `ci.yml` has never stopped a
# migration executing. On a direct push there is no pull-request CI at all.
#
# That is not hypothetical. Both migrations this queue has ever replayed
# arrived by a direct push to `main` from `gpt-engineer-app[bot]`, commit
# messages "Work in progress" and "Changes", with no pull request and so no
# review of any kind.
#
# So the gates run in THIS job, before the submission, where every path into
# the queue passes them: a merge, a direct push, and `workflow_dispatch`. They
# are plain Node scripts over `supabase/migrations` and need no dependencies —
# only Node ≥22.18, for the type stripping `check-migration-assertions` uses to
# import the parser rather than re-implement it. Keeping `npm ci` off this path
# also keeps a registry outage from being able to stop migrations applying.
#
# ## Which migrations must be RECORDED rather than run
#
# Mission Control is edited in two places, and Lovable APPLIES the migrations
# it authors before the file reaches this repository. Re-running one is at best
# a no-op and at worst a regression: `20260909072756` would double a billing
# rollup and charge for calls the business absorbs, and its own header says
# "DO NOT REPLAY".
#
# The ledger cannot answer which those are — Lovable stamps a version 2-7
# seconds from the filename's, in either direction, so only 36 of 141 such
# files carry their own version in it. Git can: the author of the commit that
# ADDED the file. That is an account, not a guess from the filename's shape,
# and the two disagree on 4 of 268 files with the author right both times —
# one bot-authored file is slug-named (the shape would have replayed it) and
# three UUID-named files were added by somebody else (the shape would have
# skipped them).
#
# `20260912150000_recorded_never_replayed.sql` carries the whole measurement.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**.sql'
  workflow_dispatch:
    inputs:
      files:
        description: 'Space-separated migration paths to apply (manual recovery)'
        required: true
        type: string

permissions:
  contents: read

# One writer at a time, and never cancel a run mid-way: a half-applied merge is
# worse than a late one.
concurrency:
  group: apply-migrations
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Both ends of the push have to be resolvable to diff them.
          fetch-depth: 0
          persist-credentials: false

      # 22, not 20: `check-migration-assertions` imports the assertion grammar
      # from its `.ts` module directly rather than keeping a second copy, which
      # needs Node's type stripping (≥22.18). It says so and exits 1 otherwise.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Select the migrations this push added
        id: select
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          MANUAL: ${{ inputs.files }}
        run: |
          set -euo pipefail
          if [ -n "${MANUAL:-}" ]; then
            echo "Manual dispatch: ${MANUAL}"
            printf 'files=%s\n' "${MANUAL}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A zero/absent BEFORE means GitHub could not give a range — a new
          # branch, or a force push. Guessing one would silently apply either
          # nothing or the entire history, and both failures are quiet. Refuse
          # and name the manual path instead.
          if [ -z "${BEFORE:-}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            echo "::error title=No push range::github.event.before is empty or zero, so the added files cannot be determined. Re-run via workflow_dispatch with an explicit file list."
            exit 1
          fi
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "::error title=Unreachable base::${BEFORE} is not in this checkout. Re-run via workflow_dispatch with an explicit file list."
            exit 1
          fi

          ADDED=$(git diff --name-only --diff-filter=A "${BEFORE}" "${AFTER}" -- 'supabase/migrations/*.sql' | tr '\n' ' ')
          # A MODIFIED migration is reported and never re-applied — see the
          # script header. Editing an applied migration is the mistake; running
          # the new text over the old one is the damage.
          CHANGED=$(git diff --name-only --diff-filter=M "${BEFORE}" "${AFTER}" -- 'supabase/migrations/*.sql' | tr '\n' ' ')
          if [ -n "${CHANGED// /}" ]; then
            echo "::warning title=Modified migration::${CHANGED} was edited rather than added. It will NOT be re-applied; a migration that has run is history. Add a new migration instead."
          fi
          echo "Added: ${ADDED:-<none>}"
          printf 'files=%s\n' "${ADDED}" >> "$GITHUB_OUTPUT"

      # Before anything is submitted, and in this job so nothing can outrun it.
      # These judge the whole corpus, not only the files this push added: a
      # duplicate version, a re-creation collision and an undeclared effect are
      # all properties of the set, and the file that breaks one of them is not
      # always the file that arrived.
      - name: Gate the corpus before submitting any of it
        if: steps.select.outputs.files != ''
        run: |
          set -euo pipefail
          node scripts/check-migration-pipeline.mjs
          node scripts/check-migration-secrets.mjs
          node scripts/check-migration-replay.mjs
          node scripts/check-migration-assertions.mjs

      # Which of the selected files were applied before they were committed.
      # Read from the author of the commit that ADDED each one; see the header.
      - name: Classify each migration by who added it
        id: classify
        if: steps.select.outputs.files != ''
        env:
          FILES: ${{ steps.select.outputs.files }}
          # The Lovable platform's own GitHub App. Matched on the numeric
          # account id rather than the display name, because a display name can
          # be changed and an account id cannot.
          LOVABLE_APP_AUTHOR: '159125892+gpt-engineer-app[bot]@users.noreply.github.com'
        run: |
          set -euo pipefail
          RECORD_ONLY=""
          for f in ${FILES}; do
            # The most recent commit that ADDED this path. Whole history rather
            # than the push range, so a workflow_dispatch recovery classifies
            # the same way a push does — the question is who added the file,
            # and that has one answer whatever selected it today.
            AUTHOR=$(git log --diff-filter=A --format=%ae -1 -- "$f" || true)
            if [ "$AUTHOR" = "$LOVABLE_APP_AUTHOR" ]; then
              echo "record-only  $f  (added by $AUTHOR)"
              RECORD_ONLY="${RECORD_ONLY}${f} "
            elif [ -z "$AUTHOR" ]; then
              # Not fatal, and deliberately so: an unreadable author means the
              # file RUNS, which is the behaviour that existed before this.
              echo "::warning title=Unattributed migration::Could not read the author that added $f; it will be executed normally."
              echo "execute      $f  (author unknown)"
            else
              echo "execute      $f  (added by $AUTHOR)"
            fi
          done
          printf 'record_only=%s\n' "${RECORD_ONLY}" >> "$GITHUB_OUTPUT"

      - name: Enqueue and wait
        if: steps.select.outputs.files != ''
        env:
          # The same shared secret every scheduled worker here authenticates
          # with, held in Mission Control's Supabase Vault as `cron_secret`.
          # A GitHub secret, not a Lovable one: GitHub has no reserved-name
          # restriction, which is what blocked storing `SUPABASE_*` on Lovable.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # No default. A wrong origin posts migration SQL to somebody else's
          # deployment, and an empty one is refused rather than guessed.
          MISSION_CONTROL_URL: ${{ vars.MISSION_CONTROL_URL }}
          FILES: ${{ steps.select.outputs.files }}
          RECORD_ONLY: ${{ steps.classify.outputs.record_only }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/enqueue-migrations.mjs
